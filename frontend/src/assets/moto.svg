<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="100%" height="100%">
  <defs>
    <linearGradient id="motoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="motoSeat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="motoWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="motoShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="58" rx="46" ry="5" fill="#000000" opacity="0.2" />

  <!-- Moto Group -->
  <g filter="url(#motoShadow)">
    <!-- Rear Wheel -->
    <circle cx="26" cy="48" r="13" fill="url(#motoWheel)" stroke="#64748b" stroke-width="2" />
    <circle cx="26" cy="48" r="7" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
    <!-- Spokes -->
    <line x1="26" y1="41" x2="26" y2="55" stroke="#94a3b8" stroke-width="1" />
    <line x1="19" y1="48" x2="33" y2="48" stroke="#94a3b8" stroke-width="1" />
    <circle cx="26" cy="48" r="2.5" fill="#0f172a" />

    <!-- Front Wheel -->
    <circle cx="94" cy="48" r="13" fill="url(#motoWheel)" stroke="#64748b" stroke-width="2" />
    <circle cx="94" cy="48" r="7" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
    <!-- Spokes -->
    <line x1="94" y1="41" x2="94" y2="55" stroke="#94a3b8" stroke-width="1" />
    <line x1="87" y1="48" x2="101" y2="48" stroke="#94a3b8" stroke-width="1" />
    <circle cx="94" cy="48" r="2.5" fill="#0f172a" />

    <!-- Exhaust Pipe & Engine -->
    <path d="M 40 48 L 22 49 C 18 49, 16 46, 18 44 L 38 43 Z" fill="#94a3b8" stroke="#64748b" stroke-width="0.8" />
    <rect x="42" y="40" width="18" height="12" rx="3" fill="#475569" />
    <line x1="44" y1="43" x2="58" y2="43" stroke="#94a3b8" stroke-width="1" />
    <line x1="44" y1="47" x2="58" y2="47" stroke="#94a3b8" stroke-width="1" />

    <!-- Frame & Chassis -->
    <path d="M 26 48 L 48 38 L 84 22 L 94 48" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 48 38 L 48 48 L 60 48" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Fuel Tank & Fairing -->
    <path d="M 52 30 C 56 22, 70 20, 78 24 L 70 34 L 50 34 Z" fill="url(#motoBody)" stroke="#c2410c" stroke-width="1" />

    <!-- Seat -->
    <path d="M 32 30 C 35 28, 48 28, 54 32 L 48 35 L 30 34 Z" fill="url(#motoSeat)" />

    <!-- Handlebars & Front Shield -->
    <path d="M 80 18 L 84 22 L 86 32" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 76 16 L 82 18" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="86" cy="22" r="3.5" fill="#facc15" stroke="#ca8a04" stroke-width="0.5" />
    <!-- Rear light -->
    <rect x="23" y="30" width="3" height="4" rx="1" fill="#ef4444" />
  </g>
</svg>
